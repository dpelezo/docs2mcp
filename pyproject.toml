[project]
name = "docs2mcp-cli"
version = "0.1.0"
description = "Turn messy API docs into curated, task-shaped MCP servers, with an eval that measures whether agents do better."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Domingos Pelezo", email = "dopelezo@gmail.com" }]
requires-python = ">=3.14"
keywords = ["mcp", "llm", "agents", "openapi", "evals"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Code Generators",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "anthropic>=2.13,<3",
    "html-to-markdown>=3.23,<4",
    "httpx>=0.28.1",
    "jinja2>=3.1,<4",
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
]

[project.urls]
Demo = "https://docs2mcp.vercel.app"
Repository = "https://github.com/dpelezo/docs2mcp"
Changelog = "https://github.com/dpelezo/docs2mcp/blob/main/CHANGELOG.md"
Results = "https://github.com/dpelezo/docs2mcp/blob/main/evals/agent/README.md"

[project.scripts]
docs2mcp = "docs2mcp.cli:main"
docs2mcp-cli = "docs2mcp.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The distribution is docs2mcp-cli; the package you import is still docs2mcp.
module-name = "docs2mcp"

[dependency-groups]
dev = [
    "mcp>=2.3,<3",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.4,<7",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12",
]
# The agent eval runner (ADR 0013, #50). Installed by default for development and CI.
eval = [
    "fastmcp>=4.2.6,<5",
    "langchain-anthropic>=1.7.12,<2",
    "langgraph>=1.2.24,<2",
]

# --- Lint and format -------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import order
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "C4",       # comprehensions
    "RET",      # return statements
    "ARG",      # unused arguments
    "PT",       # pytest style
    "N",        # naming
    "S",        # bandit security checks
    "BLE",      # blind except
    "TRY",      # exception handling
    "PL",       # pylint
    "ERA",      # commented-out code
    "RUF",      # ruff-specific
]

[tool.ruff.lint.pylint]
max-args = 8  # keyword-only options are fine

[tool.ruff.lint.isort]
known-first-party = ["docs2mcp", "scripts"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]  # assert and magic numbers are fine in tests

# --- Types ------------------------------------------------------------------

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

# --- Tests ------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=docs2mcp",
    "--cov-report=term-missing",
]  # the 80% coverage floor applies to unit tests only: see `just test` and CI
filterwarnings = [
    # langsmith (pulled in by langchain-core) calls an asyncio function deprecated in 3.14
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:langsmith",
]
markers = [
    "unit: fast tests with no network access (everything under tests/unit)",
    "integration: tests against real services (everything under tests/integration)",
]

[tool.coverage.run]
branch = true
source = ["src/docs2mcp"]

[tool.uv]
default-groups = ["dev", "eval"]
