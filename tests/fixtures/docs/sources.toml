# Documentation sources for the eval APIs.
#
# scripts/snapshot_docs.py fetches every page listed here, trims it, and saves it:
#   - redistribute = true  -> tests/fixtures/docs/<id>/ (committed, used by offline unit tests)
#   - redistribute = false -> .cache/docs/<id>/      (git-ignored, used by integration tests and evals)
# It also records retrieval date, size and SHA-256 of each committed file in manifest.json.
#
# Licence notes were checked on 2026-11-23 against each project's public repository.
# Only content we may redistribute is committed. Change `redistribute` only after checking the terms.

[[api]]
id = "pokeapi"
name = "PokéAPI"
base_url = "https://pokeapi.co/api/v2"
redistribute = true
licence = "BSD-3-Clause. Docs site source: github.com/PokeAPI/pokeapi.co (LICENSE.rst). Pokémon names are trademarks of Nintendo."
openapi = "https://raw.githubusercontent.com/PokeAPI/pokeapi/master/openapi.yml"
openapi_note = "openapi.yml in github.com/PokeAPI/pokeapi"
pages = ["https://pokeapi.co/docs/v2"]

[[api]]
id = "frankfurter"
name = "Frankfurter"
base_url = "https://api.frankfurter.dev/v2"
redistribute = true
licence = "MIT. Source: github.com/lineofflight/frankfurter (LICENSE)."
openapi = "https://raw.githubusercontent.com/lineofflight/frankfurter/main/lib/public/v2/openapi.json"
openapi_note = "The docs page documents v2. lib/public/v2/openapi.json in github.com/lineofflight/frankfurter, served at /v2/openapi.json (v1 also exists)"
pages = ["https://frankfurter.dev/"]

[[api]]
id = "open_meteo"
name = "Open-Meteo"
base_url = "https://api.open-meteo.com/v1"
redistribute = false
licence = "Docs site is AGPL-3.0 (github.com/open-meteo/open-meteo-website). Not committed; cached locally."
openapi = ""
openapi_note = "No OpenAPI file in github.com/open-meteo/open-meteo or open-meteo-website (checked 2026-11-23). Report docs2mcp's score alone."
# The forecast API only. Geocoding is on another host, so it is its own eval API below.
pages = ["https://open-meteo.com/en/docs"]

[[api]]
id = "open_meteo_geocoding"
name = "Open-Meteo Geocoding"
base_url = "https://geocoding-api.open-meteo.com/v1"
redistribute = false
licence = "Docs site is AGPL-3.0 (github.com/open-meteo/open-meteo-website). Not committed; cached locally."
openapi = ""
openapi_note = "No OpenAPI file in github.com/open-meteo/open-meteo or open-meteo-website (checked 2026-11-23). Split from open_meteo because an ApiSpec has one base_url (approved 2026-11-24)."
pages = ["https://open-meteo.com/en/docs/geocoding-api"]

[[api]]
id = "open_library"
name = "Open Library"
base_url = "https://openlibrary.org"
redistribute = false
licence = "Site source is AGPL-3.0 (github.com/internetarchive/openlibrary). Not committed; cached locally."
openapi = ""
openapi_note = "No OpenAPI file in github.com/internetarchive/openlibrary (checked 2026-11-23). Report docs2mcp's score alone."
pages = [
  "https://openlibrary.org/dev/docs/api/search",
  "https://openlibrary.org/dev/docs/api/books",
  "https://openlibrary.org/dev/docs/api/authors",
]

[[api]]
id = "postcodes_io"
name = "Postcodes.io"
base_url = "https://api.postcodes.io"
redistribute = true
licence = "MIT. Source: github.com/ideal-postcodes/postcodes.io (LICENSE)."
openapi = "https://raw.githubusercontent.com/ideal-postcodes/postcodes.io/main/static/openapi.json"
openapi_note = "static/openapi.json in github.com/ideal-postcodes/postcodes.io, served at api.postcodes.io/openapi.json. It leaves out 3 documented routes and 8 documented parameters, which evals/extraction/additions/postcodes_io.json adds. Replaces REST Countries, whose v3.1 URLs now redirect and whose v5 API needs a key (checked 2026-11-24)."
# The hand-written guide pages. The generated /docs/api pages are left out: they are rendered
# from the same OpenAPI file the reference is built from, so they would test copying, not reading.
# The docs have no index page, so each page is listed.
pages = [
  "https://postcodes.io/docs/overview",
  "https://postcodes.io/docs/postcode/lookup",
  "https://postcodes.io/docs/postcode/bulk",
  "https://postcodes.io/docs/postcode/query",
  "https://postcodes.io/docs/postcode/reverse-geocode",
  "https://postcodes.io/docs/postcode/bulk-reverse-geocode",
  "https://postcodes.io/docs/postcode/nearest",
  "https://postcodes.io/docs/postcode/autocomplete",
  "https://postcodes.io/docs/postcode/random",
  "https://postcodes.io/docs/postcode/schema",
  "https://postcodes.io/docs/outcode/lookup",
  "https://postcodes.io/docs/outcode/reverse-geocode",
  "https://postcodes.io/docs/outcode/nearest",
  "https://postcodes.io/docs/outcode/schema",
  "https://postcodes.io/docs/place/lookup",
  "https://postcodes.io/docs/place/query",
  "https://postcodes.io/docs/place/random",
  "https://postcodes.io/docs/place/schema",
  "https://postcodes.io/docs/terminated-postcode/lookup",
  "https://postcodes.io/docs/terminated-postcode/schema",
  "https://postcodes.io/docs/scottish-postcode/lookup",
  "https://postcodes.io/docs/scottish-postcode/schema",
]
