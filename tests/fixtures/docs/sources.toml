openapi = ""
openapi_note = "No OpenAPI file in github.com/internetarchive/openlibrary (checked 2026-11-23). Report docs2mcp's score alone."
pages = [
  "https://openlibrary.org/dev/docs/api/search",
  "https://openlibrary.org/dev/docs/api/books",
  "https://openlibrary.org/dev/docs/api/authors",
]

[[api]]
id = "rest_countries"
name = "REST Countries"
base_url = "https://restcountries.com/v3.1"
redistribute = false
licence = "Terms not confirmed. Not committed; cached locally."
openapi = ""
openapi_note = "No official OpenAPI spec known; not yet checked. Report docs2mcp's score alone unless one is found."
pages = ["https://restcountries.com/"]
