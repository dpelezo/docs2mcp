# What each agent eval condition is built from (ADR 0013). Read by
# scripts/build_eval_servers.py, which writes servers/eval/<condition>/<api>/.
#
# A: the committed design from the API's own OpenAPI file (#48).
# B: the direct design of `spec`, one tool per endpoint.
# C: the task-shaped design in `task_design`, made from the same `spec` with
#    `docs2mcp design --model claude-haiku-5-5` (decided 2026-11-24).
# B and C approve every valid tool as generated: no hand review or edits.
#
# `spec` is the fix36 run, the extraction after the #36 repair. For PokéAPI,
# Frankfurter and Postcodes.io (permissively licensed docs) the spec and Haiku's
# task design are committed in evals/agent/conditions/docs2mcp/ (#72), with the
# SHA-256 the full run measured. The AGPL-documented APIs stay on the owner's
# machine (specs/ and tools/ are git-ignored).

[api.pokeapi]
spec = "evals/agent/conditions/docs2mcp/pokeapi/spec.json"
task_design = "evals/agent/conditions/docs2mcp/pokeapi/tools.json"
openapi = "evals/agent/conditions/openapi/pokeapi"

[api.frankfurter]
spec = "evals/agent/conditions/docs2mcp/frankfurter/spec.json"
task_design = "evals/agent/conditions/docs2mcp/frankfurter/tools.json"
openapi = "evals/agent/conditions/openapi/frankfurter"

[api.postcodes_io]
spec = "evals/agent/conditions/docs2mcp/postcodes_io/spec.json"
task_design = "evals/agent/conditions/docs2mcp/postcodes_io/tools.json"
openapi = "evals/agent/conditions/openapi/postcodes_io"

[api.open_library]
spec = "specs/open_library/fix36/spec.json"
task_design = "tools/open_library/eval/tools.json"

[api.open_meteo]
spec = "specs/open_meteo/fix36/spec.json"
task_design = "tools/open_meteo/eval/tools.json"

[api.open_meteo_geocoding]
spec = "specs/open_meteo_geocoding/fix36/spec.json"
task_design = "tools/open_meteo_geocoding/eval/tools.json"
