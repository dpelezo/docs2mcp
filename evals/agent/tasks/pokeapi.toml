# complex: several steps

[[task]]
id = "pokeapi-017"
level = "complex"
question = "Considering both of Bulbasaur's types together, which attacking types deal double damage to it?"
evidence = """
GET https://pokeapi.co/api/v2/pokemon/bulbasaur
GET https://pokeapi.co/api/v2/type/grass
GET https://pokeapi.co/api/v2/type/poison
"""
answer = { rule = "set", value = ["fire", "ice", "flying", "psychic"] }
note = "Grass is weak to fire, ice, poison, flying and bug; poison is weak to ground and psychic. Poison resists poison and bug, and grass resists ground, so those three cancel out."

