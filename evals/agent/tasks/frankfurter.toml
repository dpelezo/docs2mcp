api = "frankfurter"

# Frankfurter blends rates from several providers by default, and a blend can
# change when providers are added. Every task asks for European Central Bank
# rates, so its answer does not drift.

# single: one call

[[task]]
id = "frankfurter-001"
level = "single"
question = "What was the European Central Bank's EUR to USD exchange rate on 2024-01-15?"
evidence = "GET https://api.frankfurter.dev/v2/rate/EUR/USD?date=2024-01-15&providers=ecb"
answer = { rule = "number", value = 1.0945, abs_tolerance = 0.00005 }

[[task]]
id = "frankfurter-002"
level = "single"
question = "What is the name of the currency with the code ISK?"
evidence = "GET https://api.frankfurter.dev/v2/currency/ISK"
answer = { rule = "exact", value = "Icelandic Króna", accept = ["Icelandic Krona"] }

[[task]]
id = "frankfurter-003"
level = "single"
question = "Using European Central Bank rates, how many Japanese yen was 1 British pound worth on 2023-06-30?"
evidence = "GET https://api.frankfurter.dev/v2/rate/GBP/JPY?date=2023-06-30&providers=ecb"
answer = { rule = "number", value = 183.11, rel_tolerance = 0.0005 }

