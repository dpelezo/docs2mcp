# multi: the right options

[[task]]
id = "open_meteo_geocoding-004"
level = "multi"
question = "Among the first 10 results Open-Meteo's geocoding returns for Springfield, which US state is the one with the largest population in?"
evidence = "GET https://geocoding-api.open-meteo.com/v1/search?name=Springfield&count=10"
answer = { rule = "exact", value = "Missouri" }
note = "Missouri 170,188; Massachusetts 154,341; Illinois 114,394."

